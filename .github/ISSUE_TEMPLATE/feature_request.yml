name: Suggest an improvement
description: Suggest a feature or visual improvement.
title: "[Suggestion]: "
labels: [enhancement]
body:
  - type: textarea
    id: suggestion
    attributes:
      label: What would you like to improve?
      description: Explain the situation and how the change would help.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples or references
      description: Screenshots, sketches or reference links are welcome.
